arazzo: 1.1.0
info:
  title: Shopify returns
  version: 1.0.0

sourceDescriptions:
  # OpenAPI generated by Connect Plane from its tool registry: one operation per registered tool,
  # POST /tools/{name}, request body = the tool's input_schema, response = its output_schema.
  # Steps therefore go through our normal tool-call path (credentials, scope checks, auditing).
  - name: shopify
    url: https://connect-plane.internal/applications/shopify/tools.openapi.json
    type: openapi
  # Built-in operations the runner handles itself, without making an HTTP call (elicit, confirm).
  - name: aircall
    url: https://connect-plane.internal/runtime.openapi.json
    type: openapi

workflows:
  - workflowId: start_return
    summary: Start a product return for the caller.
    description: Looks up the caller's fulfilled orders, has them pick one, confirms, and creates the return.
    inputs:
      type: object
      required: [reason, customer_email]
      properties:
        reason:
          type: string
          enum: [SIZE_TOO_SMALL, SIZE_TOO_LARGE, DAMAGED, OTHER]
        customer_email:
          type: string
          format: email
          x-aircall-source: context.caller_email   # filled from call context; never shown to the LLM

    steps:
      - stepId: listOrders
        operationId: $sourceDescriptions.shopify.list_orders
        requestBody:
          contentType: application/json
          payload:
            email: $inputs.customer_email
            status: fulfilled
        successCriteria:
          - condition: $statusCode == 200
        onSuccess:
          - name: noEligibleOrders
            type: end
            x-aircall-outcome: no_eligible_orders
            criteria:
              - context: $response.body
                condition: $[?count(@.orders) == 0]
                type: jsonpath
        outputs:
          orders: $response.body#/orders

      - stepId: pickOrder
        operationId: $sourceDescriptions.aircall.elicit
        x-aircall-ask:
          message: Which order is this return for?
          field: order_id
          options:
            from: $steps.listOrders.outputs.orders
            value: id
            title: "{name} – {line_items.0.title} – {created_at|date}"
          autoSelectWhenSingle: true        # one order → skip the question
          maxOptions: 5
        onSuccess:
          - name: customerBackedOut
            type: end
            x-aircall-outcome: cancelled_by_customer
            criteria:
              - condition: $response.body#/action != 'accept'
        outputs:
          orderId: $response.body#/content/order_id
          orderLabel: $response.body#/selectedTitle

      - stepId: confirmReturn
        operationId: $sourceDescriptions.aircall.confirm
        x-aircall-confirm:
          message: "Start a return for {$steps.pickOrder.outputs.orderLabel}?"
        onSuccess:
          - name: notConfirmed
            type: end
            x-aircall-outcome: not_confirmed
            criteria:
              - condition: $response.body#/content/confirmed != true

      - stepId: createReturn
        operationId: $sourceDescriptions.shopify.create_return
        x-aircall-idempotent: true        # runner derives the key from the run and step IDs
        requestBody:
          contentType: application/json
          payload:
            order_id: $steps.pickOrder.outputs.orderId
            reason: $inputs.reason
        successCriteria:
          - condition: $statusCode == 201
        onFailure:
          - name: upstreamError
            type: end
            x-aircall-outcome: return_failed
        outputs:
          returnId: $response.body#/return/id
          labelUrl: $response.body#/return/label_url

    outputs:
      returnId: $steps.createReturn.outputs.returnId
      labelUrl: $steps.createReturn.outputs.labelUrl
